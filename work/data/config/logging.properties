# Set status level
status = warn

# Property definition
property.logFileName = aplino

# Console Appender (commented out in original)
#appender.console.type = Console
#appender.console.name = console
#appender.console.layout.type = PatternLayout
#appender.console.layout.pattern = %highlight{%level} %c{1} - %msg %ex%n

# Rolling File Appender
appender.rolling.type = RollingFile
appender.rolling.name = logFile
appender.rolling.fileName = ${sys:HOME_DIR}/data/log/${logFileName}.log
appender.rolling.filePattern = ${logFileName}-%d{MM-dd-yyyy}-%i.log.gz
appender.rolling.append = true
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.alwaysWriteExceptions = false
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS};%t;%level;%c;%enc{%msg}{CRLF};%replace{%ex}{[\r\n]{1,2}}{\\n};%marker;%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10 MB
#appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
#appender.rolling.policies.time.interval = 1

# Loggers
logger.aplino.name = dev.strategia.aplino
logger.aplino.level = warn
logger.aplino.appenderRef.rolling.ref = logFile

# Root Logger
rootLogger.level = warn
#rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.rolling.ref = logFile